<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stardust</title>
<meta name="theme-color" content="#e4eaf1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stardust">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --wall:#e4eaf1;--wall2:#d3dce8;--ink:#24334a;--sub:#6a7a90;--line:#c8d2e0;--accent:#2f5fa8;--accent-ink:#fff;
  --paper:#fffdf9;--rule:#e6dfd0;--card:#fbf3e0;--cardrule:#c7d7ea;--cardred:#e7a5a2;--tape:rgba(214,196,150,.62);
  --surface:#f6f8fb;--shadow:0 8px 22px rgba(30,50,90,.18);--shadow-s:0 2px 8px rgba(30,50,90,.14);
  --lace:#bfae8f;--moon-dark:#c5ccd8;--moon-lit:#f4d98a;--ledge1:#c9d2de;--ledge2:#b3bfce;
  --ui:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --hand:"Kaiti TC","BiauKai","DFKai-SB","Noto Serif CJK TC","Songti TC",serif;
  --script:"Snell Roundhand","Apple Chancery","Zapfino",cursive;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-mode=dark]{
  --wall:#10141b;--wall2:#171c25;--ink:#dbe4f2;--sub:#8e9bb0;--line:#2b3442;--accent:#7ea6e8;--accent-ink:#0f1520;
  --paper:#222733;--rule:#313846;--card:#2c2b2f;--cardrule:#3a4556;--cardred:#7d4a4c;--tape:rgba(150,135,100,.5);
  --surface:#1a2029;--shadow:0 8px 22px rgba(0,0,0,.5);--shadow-s:0 2px 8px rgba(0,0,0,.4);
  --lace:#6f6650;--moon-dark:#3a4352;--moon-lit:#e9d18e;--ledge1:#242b37;--ledge2:#1b212b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--wall);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--wall);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
#view{position:relative;min-height:100dvh}
.page{min-height:100dvh;padding-bottom:calc(48px + var(--safe-b));background:var(--wall)}

/* ---------- 頂欄 ---------- */
.bar{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:calc(var(--safe-t) + 6px) 8px 6px;min-height:52px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--wall) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar .t{text-align:center;font-size:17px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t.script{font-family:var(--script);font-size:25px;font-weight:400;letter-spacing:0}
.bar .l,.bar .r{display:flex;min-height:44px;align-items:center}
.bar .r{justify-content:flex-end}
.bar button{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;border-radius:12px}
.bar button:active{background:var(--wall2)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 書櫃 ---------- */
.h-sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 24px 14px}
.h-sec h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
.h-sec span{font-size:13px;color:var(--sub)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 26px 0;position:relative;margin-bottom:6px}
.row::after{content:"";grid-column:1/-1;height:12px;margin:-2px -26px 0;background:linear-gradient(var(--ledge1),var(--ledge2));box-shadow:0 8px 12px -6px rgba(20,35,60,.28)}
.row{padding-bottom:0}
.bki{display:block;width:100%;position:relative;padding-bottom:0}
.bki .cv{transform-origin:bottom center;transition:transform .18s}
.bki:active .cv{transform:translateY(-4px)}
.bki .cap{padding:8px 2px 10px;font-size:14px;font-weight:600;line-height:1.3}
.bki .cap small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.bki.new .cv{aspect-ratio:2/3;border:2px dashed var(--line);border-radius:6px 10px 10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:14px}
.bki.new .cv .ic{width:30px;height:30px}
.badge{position:absolute;top:-8px;right:-8px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s)}
.badge .ic{width:16px;height:16px}
.manage .cv{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.banner{margin:6px 22px 0;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-s);display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.45}
.banner b{display:block}
.banner button{flex:none;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}

/* ---------- 封面 ---------- */
.cover{container-type:inline-size;position:relative;width:100%;aspect-ratio:2/3;background-size:cover;background-position:center;border-radius:3px 9px 9px 3px;box-shadow:var(--shadow);overflow:hidden;color:var(--ink)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.12) 3%,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 94%,rgba(0,0,0,.14));pointer-events:none}
.cover .olabel{position:absolute;left:24%;top:23.4%;width:51.4%;height:14.4%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fbf6ea,#efe5cd);box-shadow:inset 0 0 0 .7cqw rgba(60,60,60,.5),0 .4cqw 1cqw rgba(0,0,0,.25)}
.cover .ct,.cover .cs{position:absolute;display:block;font-family:var(--hand);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;font-style:normal;line-height:1;z-index:1}
.cover .ct{left:29.9%;width:36%;top:25.6%;height:6%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.4cqw;font-weight:700}
.cover .cs{left:35.5%;width:24.8%;top:31.9%;height:4.5%;display:flex;align-items:flex-end;justify-content:center;font-size:3.1cqw}
.cover.photo .ct,.cover.photo .cs{color:#2a2f3a}

/* ---------- 年 / 目錄 ---------- */
.hero{display:flex;gap:18px;align-items:center;padding:14px 24px 8px}
.hero .cover{width:84px;flex:none}
.hero h1{margin:0;font-size:26px;letter-spacing:.03em;line-height:1.2}
.hero p{margin:6px 0 0;color:var(--sub);font-size:14px;line-height:1.5}
.toc{display:flex;align-items:baseline;gap:8px;width:calc(100% - 48px);margin:0 24px;padding:16px 4px 14px;border-bottom:1px solid var(--line);min-height:56px}
.toc:active{background:var(--wall2)}
.toc .tn{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;width:34px;text-align:right}
.toc .tm{font-size:16px;font-weight:600}
.toc .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);margin:0 4px}
.toc .tc{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.toc.now .tn,.toc.now .tm{color:var(--accent)}
.toc.future{opacity:.55}

/* ---------- 月曆 ---------- */
.mhead{padding:10px 24px 12px;display:flex;align-items:flex-end;justify-content:space-between}
.mhead h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.02em}
.mhead h1 small{font-size:15px;font-weight:400;color:var(--sub);margin-left:8px}
.mhead .cnt{font-size:14px;color:var(--accent);font-weight:600}
.cal{margin:0 14px;padding:12px 8px 14px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-s)}
.cal .wd,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wd span{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 8px}
.cal .wd span:first-child,.cal .wd span:last-child{opacity:.85}
.cell{position:relative;aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:16px;font-variant-numeric:tabular-nums}
.cell:active{background:var(--wall2)}
.cell.empty{pointer-events:none}
.cell .d{line-height:1}
.cell .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.cell.has .dot{background:var(--accent)}
.cell.today .d{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cell.future{opacity:.45}
.moon{width:12px;height:12px;display:block}
.acts{display:flex;gap:10px;padding:16px 14px 0}
.btn{flex:1;min-height:46px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-s);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--accent)}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c0463f}
.note-sm{padding:14px 26px 0;font-size:13px;color:var(--sub);line-height:1.6}

/* ---------- 日編輯 ---------- */
.dhead{padding:6px 24px 14px;display:flex;align-items:center;gap:14px}
.dhead .dd{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.dhead .dw{font-size:14px;color:var(--sub);line-height:1.5}
.dhead .mn{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.dhead .mn .moon{width:30px;height:30px}

.letter{position:relative;margin:14px 14px 0;padding:34px 22px 34px;background:var(--paper);border-radius:4px;box-shadow:var(--shadow-s)}
.letter::before,.letter::after{content:"";position:absolute;left:0;right:0;height:12px;background-repeat:repeat-x;background-position:center}
.letter::before{top:6px;background-image:var(--lace-t)}
.letter::after{bottom:6px;background-image:var(--lace-b)}
.letter .side{position:absolute;top:22px;bottom:22px;width:0;border-left:1.5px dotted var(--lace)}
.letter .side.a{left:8px}.letter .side.b{right:8px}
.corner{position:absolute;width:22px;height:22px;color:var(--lace)}
.corner.tl{left:3px;top:3px}.corner.tr{right:3px;top:3px;transform:scaleX(-1)}
.corner.bl{left:3px;bottom:3px;transform:scaleY(-1)}.corner.br{right:3px;bottom:3px;transform:scale(-1,-1)}
.sec-t{margin:0 0 6px;font-family:var(--hand);font-size:19px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;border-bottom:1px dotted var(--lace)}
.gl{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.gl .gn{flex:none;width:26px;height:32px;font-family:var(--hand);font-size:19px;line-height:32px;color:var(--accent);text-align:center}
.ruled{display:block;width:100%;border:0;outline:0;resize:none;background-color:transparent;padding:0;margin:0;font-family:var(--hand);font-size:18px;line-height:32px;min-height:32px;overflow:hidden;border-radius:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;caret-color:var(--accent)}
.ruled::placeholder{color:color-mix(in srgb,var(--sub) 60%,transparent)}

.cardp{position:relative;margin:30px 20px 0;padding:30px 20px 20px;background-color:var(--card);background-image:var(--grain);border-radius:5px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 8px 18px rgba(60,50,30,.18);transform:rotate(-.5deg)}
.cardp .tp{position:absolute;top:-11px;width:74px;height:22px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.12);backdrop-filter:blur(1px)}
.cardp .tp.a{left:22px;transform:rotate(-5deg)}.cardp .tp.b{right:22px;transform:rotate(4deg)}
.cardp .sec-t{margin-bottom:12px}
.cardp .ruled{font-size:19px;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--cardrule) 33px 34px);line-height:34px;min-height:68px}
.cardp .crow{display:flex;gap:10px;margin-top:16px}
.chip{text-align:center;flex:1;min-height:42px;border-radius:21px;border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600}
.chip:active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.saved{text-align:center;height:22px;margin-top:18px;font-size:13px;color:var(--sub);opacity:0;transition:opacity .4s}
.saved.on{opacity:1}

/* ---------- 抽卡 ---------- */
.dm{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(14,22,38,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.dm.on{opacity:1}
.flip{width:min(78vw,320px);aspect-ratio:3/4.1;perspective:1200px}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.flip.show .in{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.flip .f.back{background:radial-gradient(circle at 50% 38%,#3c6fb8,#1e3f7c 70%);display:flex;align-items:center;justify-content:center;color:#eaf1ff;font-size:76px;border:2px solid rgba(255,255,255,.35);outline:1px solid rgba(255,255,255,.18);outline-offset:-10px}
.flip .f.front{transform:rotateY(180deg);background-color:#fbf3e0;background-image:var(--grain),repeating-linear-gradient(to bottom,transparent 0 35px,#c7d7ea 35px 36px);padding:34px 24px 20px;display:flex;flex-direction:column;color:#2a2f3a}
.flip .f.front .cat{font-size:13px;color:#7a7f8c;letter-spacing:.08em}
.flip .f.front .tx{flex:1;display:flex;align-items:center;font-family:var(--hand);font-size:23px;line-height:36px;font-weight:700}
.flip .f.front .tp{position:absolute;top:-10px;left:50%;margin-left:-37px;width:74px;height:22px;background:rgba(214,196,150,.75);transform:rotate(-3deg)}
.dm .dbtn{display:flex;gap:10px;margin-top:26px;width:min(88vw,360px)}
.dm .dbtn button{text-align:center;flex:1;min-height:48px;border-radius:24px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:15px;border:1px solid rgba(255,255,255,.3)}
.dm .dbtn button.p{background:#fff;color:#1e3f7c;border-color:#fff}
.dm .dbtn button.fv.on{background:#f4d98a;color:#4a3a10;border-color:#f4d98a}
.dm .x{margin-top:14px;color:rgba(255,255,255,.75);min-height:44px;padding:0 20px}

/* ---------- 小日記 ---------- */
.nl{margin:6px 14px 0;display:flex;flex-direction:column;gap:10px}
.ni{display:block;width:100%;padding:14px 18px;background:var(--paper);border-radius:12px;box-shadow:var(--shadow-s);position:relative}
.ni:active{filter:brightness(.97)}
.ni .nd{font-size:12px;color:var(--sub);letter-spacing:.03em}
.ni .nt{font-family:var(--hand);font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .nx{font-family:var(--hand);font-size:15px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.empty-s{text-align:center;color:var(--sub);padding:60px 36px;font-size:15px;line-height:1.8}
.fab{position:fixed;right:20px;bottom:calc(22px + var(--safe-b));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:6}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.titlein{display:block;width:100%;border:0;outline:0;background:transparent;font-family:var(--hand);font-size:22px;font-weight:700;line-height:36px;padding:0 0 4px;margin:0 0 6px;border-bottom:1px dotted var(--lace)}
.titlein::placeholder{color:color-mix(in srgb,var(--sub) 60%,transparent)}
.nmeta{font-size:13px;color:var(--sub);margin-bottom:8px}
.nbody{min-height:260px}

/* ---------- 底部面板 ---------- */
.sheetwrap{position:fixed;inset:0;z-index:70;pointer-events:none}
.sheetwrap .sbd{position:absolute;inset:0;background:rgba(10,16,28,.45);opacity:0;transition:opacity .25s}
.sheetwrap.on{pointer-events:auto}
.sheetwrap.on .sbd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--wall);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheetwrap.on .sheet{transform:none}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .hint{font-size:13px;color:var(--sub);line-height:1.6;margin:0 0 14px}
.sheet .grp{background:var(--surface);border-radius:14px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow-s)}
.sheet .it{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sheet .it:last-child{border-bottom:0}
.sheet .it:active{background:var(--wall2)}
.sheet .it .v{margin-left:auto;font-size:14px;color:var(--sub);text-align:right}
.sheet .it .ic{color:var(--accent);flex:none}
.sheet .it.danger{color:#c0463f}
.seg{display:flex;background:var(--wall2);border-radius:10px;padding:3px;margin-left:auto}
.seg button{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);font-weight:600}
.field{display:block;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:0;font-size:16px}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:150px;line-height:1.6;resize:none}
.lbl{display:block;font-size:13px;color:var(--sub);margin:14px 2px 8px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw button{position:relative;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;background-size:cover;background-position:center;box-shadow:var(--shadow-s)}
.sw button.on{outline:3px solid var(--accent);outline-offset:2px}
.sw button.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--accent);font-size:12px;outline:1.5px dashed var(--line)}
.sw button.ph .ic{width:24px;height:24px}
.row2{display:flex;gap:10px;margin-top:18px}
.pl{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--hand);font-size:16px;line-height:1.55}
.pl:last-child{border-bottom:0}
.pl .x{margin-left:auto;flex:none;color:var(--sub);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.pv{font-size:14px;line-height:1.7;background:var(--surface);padding:12px 14px;border-radius:12px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
.opt input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(40px + var(--safe-b));transform:translate(-50%,20px);background:rgba(30,40,58,.92);color:#fff;padding:12px 20px;border-radius:22px;font-size:15px;z-index:90;opacity:0;transition:.3s;max-width:86vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 開闔動畫舞台 ---------- */
.stg{position:fixed;z-index:50;transform-origin:0 0;pointer-events:none}
.stg .bkk{position:relative;width:100%;height:100%;perspective:1400px}
.stg .pgs{position:absolute;inset:0;background:var(--paper);border-radius:2px 8px 8px 2px;box-shadow:var(--shadow);background-image:repeating-linear-gradient(to bottom,transparent 0 11%,var(--rule) 11% 11.4%)}
.stg .door{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d}
.stg .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.stg .face.back{transform:rotateY(180deg);background:#e9e1cf;border-radius:8px 2px 2px 8px;box-shadow:inset 0 0 30px rgba(0,0,0,.12)}
.stg .face.front .cover{height:100%;aspect-ratio:auto}

/* ---------- 第二階段 ---------- */
.mood{margin:0 14px 12px;padding:12px 8px 10px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.mood>span{grid-column:1/-1;font-size:13px;color:var(--sub);padding:0 10px 6px}
.mood button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;min-height:56px;text-align:center}
.mood button i{font-style:normal;font-size:26px;line-height:1;filter:grayscale(.85);opacity:.6;transition:.15s}
.mood button small{font-size:11px;color:var(--sub)}
.mood button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.mood button.on i{filter:none;opacity:1;transform:scale(1.12)}
.mood button.on small{color:var(--accent);font-weight:600}
.phs,.tys{margin:30px 20px 0}
.phs .sec-t,.tys .sec-t{margin-bottom:12px}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pt{aspect-ratio:1/1.12;background:#fff;padding:6px 6px 22px;border-radius:3px;box-shadow:var(--shadow-s);position:relative;display:block}
.pt:nth-child(odd){transform:rotate(-1.4deg)}.pt:nth-child(even){transform:rotate(1.2deg)}
.pt img{width:100%;height:100%;object-fit:cover;display:block;background:var(--wall2)}
.pt.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:13px;transform:none}
.ty{display:flex;gap:12px;align-items:baseline;width:100%;padding:12px 16px;margin-bottom:8px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-s)}
.ty b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.ty span{font-family:var(--hand);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wishtile{display:flex;align-items:center;gap:14px;width:calc(100% - 52px);margin:0 26px;padding:16px 18px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s)}
.wishtile .ic{width:28px;height:28px;color:var(--accent);flex:none}
.wishtile b{display:block;font-size:16px}.wishtile small{font-size:13px;color:var(--sub)}
.seg.wide{display:flex;margin:0}.seg.wide button{flex:1;text-align:center;padding:9px 0}
.wadd{display:flex;gap:10px;padding:0 14px 12px}.wadd .field{flex:1}.wadd .btn{flex:none;padding:0 18px}
.wi{display:block;width:100%;padding:14px 18px;background:var(--paper);border-radius:12px;box-shadow:var(--shadow-s);font-family:var(--hand);font-size:17px;line-height:1.5}
.wi small{display:block;font-family:var(--ui);font-size:12px;color:var(--sub);margin-top:4px}
.wi em{display:block;font-style:normal;font-size:15px;color:var(--sub);margin-top:6px;border-top:1px dotted var(--lace);padding-top:6px}
.wi.done{border-left:4px solid var(--moon-lit)}
.wi.static{margin-bottom:10px}
.rv{padding:6px 20px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:14px 4px 12px;text-align:center;box-shadow:var(--shadow-s)}
.stat b{display:block;font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.rt{margin:26px 0 12px;font-size:16px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;height:120px;align-items:end;background:var(--surface);padding:14px 10px 6px;border-radius:14px;box-shadow:var(--shadow-s);box-sizing:content-box}
.bc{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bc i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bc span{font-size:10px;color:var(--sub);line-height:1}
.mr{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.mr div{height:10px;background:var(--wall2);border-radius:5px;overflow:hidden}.mr div i{display:block;height:100%;background:var(--moon-lit);border-radius:5px}
.mr em{font-style:normal;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

</style>

  hits.forEach((h, k) => {

    const date = h.y + '-' + pad(h.mo) + '-' + pad(h.d);
    if (h.mo < 1 || h.mo > 12 || h.d < 1 || h.d > 31) return;
    const g = ['', '', ''], mlines = []; let mode = '';
    for (const raw of body.split(/\r?\n/)) {
      const line = raw.trim();
      if (/^[─—\-_=━]{5,}$/.test(line)) { mode = 'stop'; continue; }
      if (mode === 'stop') continue;
      const gm = line.slice(0, 16).match(/感恩\s*([①-③123一二三])/);
      if (gm) {
        const idx = '①②③'.indexOf(gm[1]) >= 0 ? '①②③'.indexOf(gm[1]) : ('123'.indexOf(gm[1]) >= 0 ? '123'.indexOf(gm[1]) : '一二三'.indexOf(gm[1]));
        const pos = line.indexOf(gm[0]) + gm[0].length;
        g[idx] = line.slice(pos).replace(/^[\s:：]+/, '').trim(); mode = 'g'; continue;
      }
      const mm = line.slice(0, 16).match(/顯化語/);
      if (mm) { const rest = line.slice(line.indexOf('顯化語') + 3).replace(/^[\s:：]+/, '').trim(); if (rest) mlines.push(rest); mode = 'm'; continue; }
      if (mode === 'm' && line) mlines.push(line);
    }
    const mt = mlines.join('\n');
    if (g.some(Boolean) || mt) out.push({ date, g, m: mt });
  });
  return out;
}

function resizeCover(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const W = 540, H = 810, c = document.createElement('canvas'); c.width = W; c.height = H;
      const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
      c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = rej; img.src = u;
  });
}

  wtab: el => { stack[stack.length - 1].tab = el.dataset.v; refresh(); },
  addwish: () => { const i = $('#newwish'), v = (i.value || '').trim(); if (!v) return; db.wishes.push({ id: 'w' + Date.now().toString(36), text: v, created: new Date().toISOString(), done: null, note: '' }); save(); refresh(); },
  wish: el => { const w = db.wishes.find(x => x.id === el.dataset.id); if (!w) return; sheet(`<h3>${w.done ? '已實現的願望' : '願望'}</h3><span class="lbl">願望內容</span><textarea class="field" id="wtext" style="min-height:90px">${esc(w.text)}</textarea><span class="lbl">${w.done ? '實現的過程' : '實現了嗎?寫下過程(選填)'}</span><textarea class="field" id="wnote" style="min-height:90px" placeholder="例如:怎麼發生的、當下的心情">${esc(w.note || '')}</textarea><div class="row2"><button class="btn pri" data-act="wsave" data-id="${w.id}">儲存</button>${w.done ? `<button class="btn" data-act="wundo" data-id="${w.id}">改回進行中</button>` : `<button class="btn" data-act="wdone" data-id="${w.id}">${ICON.star}已實現</button>`}</div><div class="row2"><button class="btn danger" data-act="wdel" data-id="${w.id}">刪除</button></div>`); },
  wsave: el => { const w = db.wishes.find(x => x.id === el.dataset.id); w.text = ($('#wtext').value || '').trim() || w.text; w.note = $('#wnote').value.trim(); save(); closeSheet(); refresh(); },
  wdone: el => { const w = db.wishes.find(x => x.id === el.dataset.id); w.text = ($('#wtext').value || '').trim() || w.text; w.note = $('#wnote').value.trim(); w.done = new Date().toISOString(); save(); closeSheet(); refresh(); toast('恭喜實現!'); },
  wundo: el => { const w = db.wishes.find(x => x.id === el.dataset.id); w.done = null; save(); closeSheet(); refresh(); },
  wdel: el => { const id = el.dataset.id; confirmSheet('刪除這個願望?', '刪除', () => { db.wishes = db.wishes.filter(w => w.id !== id); save(); refresh(); }, true); },
  review: el => push({ t: 'review', y: +el.dataset.y }),
  month: el => push({ t: 'month', y: +el.dataset.y, m: +el.dataset.m }),
  day: el => push({ t: 'day', d: el.dataset.d }),
  exportmonth: el => { const y = +el.dataset.y, m = +el.dataset.m, t = monthText(y, m); if (!t) { toast('這個月還沒有內容'); return; } shareText(t, y + '/' + pad(m)); },
  shareday: el => shareText(dayText(el.dataset.d), el.dataset.d),
  draw: drawOpen, drawagain: drawFlip, drawclose: drawClose,
  drawfav: () => { const t = $('#dtx').textContent; const on = toggleFav(t); $('#dfv').classList.toggle('on', on); $('#dfv').textContent = on ? '已收藏' : '收藏'; refreshFavChip(); },
  drawuse: () => { const t = $('#dtx').textContent, d = stack[stack.length - 1].d, x = getDay(d); x.m = t; save(); drawClose(); const ta = $('textarea[data-m]'); if (ta) { ta.value = t; autosize(ta); } refreshFavChip(); flashSaved(); },
  favcur: () => { const ta = $('textarea[data-m]'), t = (ta.value || '').trim(); if (!t) { toast('先寫下或抽一句顯化語'); return; } const on = toggleFav(t); toast(on ? '已收藏' : '已取消收藏'); refreshFavChip(); },
  newnote: el => push({ t: 'note', id: null, book: el.dataset.book }),
  note: el => push({ t: 'note', id: el.dataset.id }),
  sharenote: el => shareText(noteText(db.notes[el.dataset.id])),
  delnote: el => confirmSheet('刪除這一篇?', '刪除', () => { delete db.notes[el.dataset.id]; save(); history.back(); toast('已刪除'); }, true)
};
function refreshFavChip() { const c = $('[data-act=favcur]'), ta = $('textarea[data-m]'); if (!c || !ta) return; const t = ta.value.trim(); c.classList.toggle('on', !!t && db.phrases.fav.includes(t)); }
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); } });

let saveT, curNote = null;
function flashSaved() { const s = $('#saved'); if (!s) return; s.classList.add('on'); clearTimeout(flashSaved.t); flashSaved.t = setTimeout(() => s.classList.remove('on'), 1400); }
document.addEventListener('input', e => {
  const t = e.target, r = stack[stack.length - 1];
  if (t.classList && t.classList.contains('ruled')) autosize(t);
  if (r.t === 'day' && (t.dataset.g != null || t.dataset.m != null)) {
    const x = getDay(r.d);
    if (t.dataset.g != null) x.g[+t.dataset.g] = t.value; else { x.m = t.value; refreshFavChip(); }
    schedule(() => { if (!dayHas(r.d)) delete db.days[r.d]; });
  } else if (r.t === 'note' && (t.dataset.nt != null || t.dataset.nx != null)) {
    let n = r.id && db.notes[r.id];
    if (!n) { const now = new Date(); n = { id: 'n' + Date.now().toString(36), book: r.book, date: todayStr(), time: pad(now.getHours()) + ':' + pad(now.getMinutes()), title: '', text: '' }; db.notes[n.id] = n; r.id = n.id; }
    if (t.dataset.nt != null) n.title = t.value; else n.text = t.value;
    schedule();
  }
});
function schedule(fn) { clearTimeout(saveT); saveT = setTimeout(() => { if (fn) fn(); if (save()) flashSaved(); }, 450); }
addEventListener('pagehide', () => { clearTimeout(saveT); const r = stack[stack.length - 1]; if (r.t === 'day' && !dayHas(r.d)) delete db.days[r.d]; save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(saveT); save(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.g != null && !e.isComposing) {
    e.preventDefault(); const next = $(`textarea[data-g="${+t.dataset.g + 1}"]`) || $('textarea[data-m]'); if (next) next.focus();
  }
});

/* ============ 啟動 ============ */
function boot() {
  applyTheme();
  const view = $('#view');
  history.replaceState({ n: 1 }, '');
  const q = new URLSearchParams(location.search);
  if (q.get('write') === 'today') { history.replaceState({ n: 1 }, '', location.pathname); openDay(todayStr()); }
  else view.appendChild(makePage(render(stack[0])));
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => { });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'write-today') openDay(todayStr()); });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
window.__stardust = { get db() { return db; }, parseImport, dayText, monthText, moonF, moonName };

</script>
</body>
</html>
